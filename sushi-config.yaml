  Extensions: extensions.html
  Terminology: terminology.html
  Artifacts: artifacts.html

resources:
  Encounter/xver-encounter-r4:
    name: Cross-Version Encounter R4
    description: Example for CH IG Encounter using a backport extension for a new introduced resource element in R5 (Encounter.subjectStatus).
    exampleBoolean: true
    profile:
      - http://fhir.ch/ig/ch-ig/StructureDefinition/ch-ig-encounter

  CyclistAnnaMuller:
    name: CyclistAnnaMuller
    description: Example cyclist Anna Müller with FTP extension
    exampleBoolean: true
    profile:
      - http://fhir.ch/ig/ch-ig/StructureDefinition/cyclist

  CyclistThomasWeber:
    name: CyclistThomasWeber
    description: Example professional cyclist Thomas Weber
    exampleBoolean: true
    profile:
      - http://fhir.ch/ig/ch-ig/StructureDefinition/cyclist

  RaceBikeCanyonUltimate:
    name: RaceBikeCanyonUltimate
    description: Anna's Canyon Ultimate CF SLX 8.0 race bike
    exampleBoolean: true
    profile:
      - http://fhir.ch/ig/ch-ig/StructureDefinition/race-bike

  RaceBikeSpecializedSWorks:
    name: RaceBikeSpecializedSWorks
    description: Thomas's Specialized S-Works Tarmac SL7 race bike
    exampleBoolean: true
    profile:
      - http://fhir.ch/ig/ch-ig/StructureDefinition/race-bike

  TrainingRideAnnaMorning:
    name: TrainingRideAnnaMorning
    description: Anna's morning interval training ride
    exampleBoolean: true
    profile:
      - http://fhir.ch/ig/ch-ig/StructureDefinition/training-ride

  RideMetricAnnaPower:
    name: RideMetricAnnaPower
    description: Anna's power metric - 215W average
    exampleBoolean: true
    profile:
      - http://fhir.ch/ig/ch-ig/StructureDefinition/ride-metric

  RideMetricAnnaHeartRate:
    name: RideMetricAnnaHeartRate
    description: Anna's heart rate metric - 142 bpm average
    exampleBoolean: true
    profile:
      - http://fhir.ch/ig/ch-ig/StructureDefinition/ride-metric

  RideMetricAnnaCadence:
    name: RideMetricAnnaCadence
    description: Anna's cadence metric - 88 rpm
    exampleBoolean: true
    profile:
      - http://fhir.ch/ig/ch-ig/StructureDefinition/ride-metric

  RideMetricAnnaSpeed:
    name: RideMetricAnnaSpeed
    description: Anna's speed metric - 32.5 km/h
    exampleBoolean: true
    profile:
      - http://fhir.ch/ig/ch-ig/StructureDefinition/ride-metric

# Parameters
  # Core FHIR: http://build.fhir.org/codesystem-guide-parameter-code.html
  # FHIR Tools IG: http://build.fhir.org/ig/FHIR/fhir-tools-ig/branches/master/CodeSystem-ig-parameters.html
parameters:
  excludettl: true
  allow-extensible-warnings: true
  display-warnings: true 
  path-expansion-params: '../../expansion-params.json'  # for using SNOMED CT Swiss Extension
  pin-canonicals: pin-multiples
  path-resource:
    - input/resources  

FSHOnly: false
applyExtensionMetadataToRoot: false
instanceOptions:
  setMetaProfile: always
  setId: always
  manualSliceOrdering: true
