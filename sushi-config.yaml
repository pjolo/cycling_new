  usecase-french.md:
    title: Cas d'application 
  guidance.md:
    title: Guidance
  profiles.md:
    title: Profiles
  extensions.md:
    title: Extensions
  terminology.md:
    title: Terminology
  changelog.md:
    title: Changelog  

menu:
  Home: index.html
  Document: document.html
  Use Case:
   German: usecase-german.html
   French: usecase-french.html
  Guidance: guidance.html
