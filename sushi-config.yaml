id: ch.fhir.ig.ch-ig
canonical: http://fhir.ch/ig/ch-ig
name: CH_IG
title: "CH IG (R4)"
description: Template for HL7.ch FHIR Implementation Guides
status: draft # draft | active | retired | unknown
license: CC0-1.0
copyright: CC0-1.0
jurisdiction: urn:iso:std:iso:3166#CHE
date: 2025-12-10
version: 1.2.3 # 1.2.3 published in December 2025
fhirVersion: 4.0.1
copyrightYear: 2024+
releaseLabel: draft # ci-build # ci-build | draft | qa-preview | ballot | trial-use | release | update | normative+trial-use
publisher:
  name: HL7 Switzerland
contact:
  - name: HL7 Switzerland
    telecom:
      - system: url
        value: https://www.hl7.ch/

dependencies:
  hl7.terminology.r4: 
    uri: http://terminology.hl7.org/ImplementationGuide/hl7.terminology
    version: 6.4.0 
  ch.fhir.ig.ch-core: 6.0.0-ballot
  hl7.fhir.uv.xver-r5.r4: 0.1.0
 # hl7.fhir.uv.xver-r5.r4: latest # https://packages2.fhir.org/packages/

